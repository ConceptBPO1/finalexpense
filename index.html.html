<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final Expense Quote</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 90%;
            max-width: 600px;
        }

        h1 {
            color: #007bff;
            margin-bottom: 20px;
        }

        p {
            margin-bottom: 25px;
            line-height: 1.6;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="number"] {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }

        button {
            background-color: #28a745;
            color: white;
            padding: 15px 25px;
            border: none;
            border-radius: 4px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #1e7e34;
        }

        #jornaya-container {
            margin-top: 20px;
            font-size: 0.9em;
            color: #555;
        }
    </style>
    <script type="text/javascript">
        /* Jornaya will go here */
    </script>
</head>
<body>
    <div class="container">
        <h1>Get Your Final Expense Quote</h1>
        <p>
            Protect your loved ones. Fill out the form below to get a free,
            no-obligation quote.
        </p>
        <form id="quote-form">
            <input type="text" id="name" name="name" placeholder="Your Name" required />
            <input type="email" id="email" name="email" placeholder="Your Email" required />
            <input type="tel" id="phone" name="phone" placeholder="Your Phone" required />
            <input type="text" id="state" name="state" placeholder="State" required />
            <input type="text" id="zip" name="zip" placeholder="Zip Code" required />
            <input type="number" id="age" name="age" placeholder="Your Age" required />
            <button type="submit">Get Your Free Quote</button>
        </form>
        <div id="jornaya-container">
        </div>
        <script id="LeadiDscript" type="text/javascript">
            (function () {
                var s = document.createElement('script');
                s.id = 'LeadiDscript_campaign';
                s.type = 'text/javascript';
                s.async = true;
                s.src =
                    '//create.lidstatic.com/campaign/5cc43f0c-14ff-197a-5115-0f66b86d1c5b.js?snippet_version=2';
                var LeadiDscript = document.getElementById('LeadiDscript');
                LeadiDscript.parentNode.insertBefore(s, LeadiDscript);
            })();
        </script>
        <noscript><img
                src='//create.leadid.com/noscript.gif?lac=EDA164F6-3B43-5E42-58E4-F6C57E2EEC3E&lck=5cc43f0c-14ff-197a-5115-0f66b86d1c5b&snippet_version=2' /></noscript>
    </div>
    <script>
        document.getElementById("quote-form").addEventListener("submit", function (event) {
            event.preventDefault();

            const name = document.getElementById("name").value;
            const email = document.getElementById("email").value;
            const phone = document.getElementById("phone").value;
            const state = document.getElementById("state").value;
            const zip = document.getElementById("zip").value;
            const age = document.getElementById("age").value;

            console.log("Form Data:", { name, email, phone, state, zip, age });
            alert("Thank you! Your information has been submitted.");
        });
    </script>
</body>
</html>
